<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The Rempit: pink hijab, deadpan face, on the void. -->
  <rect width="64" height="64" rx="14" fill="#05010f"/>
  <!-- Hijab: head and drape -->
  <path d="M11 60C11 45 15 39 19 33C16 11 48 11 45 33C49 39 53 45 53 60Z" fill="#e3a3b2"/>
  <!-- Hijab shadow fold along the face -->
  <path d="M22 34C21 22 43 22 42 34C40 44 24 44 22 34Z" fill="#c97f93"/>
  <!-- Face -->
  <path d="M23 33C22 22 42 22 41 33C40 43 24 43 23 33Z" fill="#f4cba8"/>
  <!-- Deadpan: half-lidded eyes and a flat mouth -->
  <path d="M26.5 31.5h4M33.5 31.5h4" stroke="#05010f" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="28.5" cy="32.4" r="1.3" fill="#05010f"/>
  <circle cx="35.5" cy="32.4" r="1.3" fill="#05010f"/>
  <path d="M29 37.5h6" stroke="#05010f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Fuchsia pin: the brand accent -->
  <circle cx="45" cy="44" r="2.6" fill="#e879f9"/>
</svg>
